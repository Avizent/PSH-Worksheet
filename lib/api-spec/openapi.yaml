      summary: Get a snapshot by ID
      description: Returns the full snapshot detail including all budget line data
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full snapshot detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotDetail"
