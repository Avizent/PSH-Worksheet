openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard summary
  - name: budget-lines
    description: Budget line items
  - name: monthly-plans
    description: Monthly plan amounts
  - name: monthly-actuals
    description: Monthly actual amounts
  - name: alerts
    description: Budget alerts
  - name: events
    description: Marketing events
  - name: board
    description: Board view settings, tokens, and data
  - name: exports
    description: PDF and Excel exports
  - name: seed
    description: Data seeding
  - name: reforecast
    description: Forecast versioning and reforecast
  - name: audit
    description: Audit log
  - name: admin
    description: Admin actions
  - name: excel
    description: Excel export and import
  - name: snapshots
    description: Budget snapshot save and restore
  - name: event-management
    description: Event task management, reminders and in-app alerts
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard KPI summary
      description: Returns aggregated KPI data for the budget dashboard
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: integer
            default: 2026
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /budget-lines:
    get:
      operationId: listBudgetLines
      tags: [budget-lines]
      summary: List all budget lines
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: costStatus
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of budget lines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetLine"
    post:
      operationId: createBudgetLine
      tags: [budget-lines]
      summary: Create a budget line
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBudgetLineBody"
      responses:
        "201":
          description: Created budget line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetLine"

  /budget-lines/{id}:
    get:
      operationId: getBudgetLine
      tags: [budget-lines]
      summary: Get a budget line
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Budget line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetLine"
        "404":
          description: Not found
    patch:
      operationId: updateBudgetLine
      tags: [budget-lines]
      summary: Update a budget line
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBudgetLineBody"
      responses:
        "200":
          description: Updated budget line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetLine"
        "404":
          description: Not found
    delete:
      operationId: deleteBudgetLine
      tags: [budget-lines]
      summary: Delete a budget line
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /budget-lines/categories:
    get:
      operationId: listBudgetLineCategories
      tags: [budget-lines]
      summary: List distinct categories used by budget lines
      responses:
        "200":
          description: List of category names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /budget-lines/{id}/plans:
    put:
      operationId: upsertMonthlyPlanByLine
      tags: [monthly-plans]
      summary: Upsert a monthly plan amount for a budget line by month/year
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertMonthlyPlanByLineBody"
      responses:
        "200":
          description: Upserted monthly plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyPlan"

  /budget-lines/{id}/actuals:
    put:
      operationId: upsertMonthlyActualByLine
      tags: [monthly-actuals]
      summary: Upsert a monthly actual amount for a budget line by month/year
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertMonthlyActualByLineBody"
      responses:
        "200":
          description: Upserted monthly actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyActual"
        "409":
          description: Cannot blank an import-linked actual

  /categories:
    get:
      operationId: listCategories
      tags: [admin]
      summary: List all categories with line count
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryWithCount"
    post:
      operationId: createCategory
      tags: [admin]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryBody"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    patch:
      operationId: updateCategory
      tags: [admin]
      summary: Update a category (renames budget lines referencing the old name)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryBody"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Not found
    delete:
      operationId: deleteCategory
      tags: [admin]
      summary: Delete a category from the registry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /budget-line-columns:
    get:
      operationId: listBudgetLineColumns
      tags: [admin]
      summary: List all custom budget-line columns
      responses:
        "200":
          description: List of custom columns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetLineColumn"
    post:
      operationId: createBudgetLineColumn
      tags: [admin]
      summary: Create a custom budget-line column
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBudgetLineColumnBody"
      responses:
        "201":
          description: Created column
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetLineColumn"
        "409":
          description: Column with that name already exists

  /budget-line-columns/reorder:
    patch:
      operationId: reorderBudgetLineColumns
      tags: [admin]
      summary: Reorder custom budget-line columns
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderBudgetLineColumnsBody"
      responses:
        "200":
          description: New ordered list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetLineColumn"

  /budget-line-columns/{id}:
    patch:
      operationId: updateBudgetLineColumn
      tags: [admin]
      summary: Rename or change type of a custom column
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBudgetLineColumnBody"
      responses:
        "200":
          description: Updated column
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetLineColumn"
        "404":
          description: Not found
        "409":
          description: Name conflict
    delete:
      operationId: deleteBudgetLineColumn
      tags: [admin]
      summary: Delete a custom column (also strips its values from every budget line)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /owners:
    get:
      operationId: listOwners
      tags: [admin]
      summary: List all owners
      responses:
        "200":
          description: List of owners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Owner"
    post:
      operationId: createOwner
      tags: [admin]
      summary: Create an owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOwnerBody"
      responses:
        "201":
          description: Created owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"

  /owners/{id}:
    patch:
      operationId: updateOwner
      tags: [admin]
      summary: Update an owner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOwnerBody"
      responses:
        "200":
          description: Updated owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"
        "404":
          description: Not found
    delete:
      operationId: deleteOwner
      tags: [admin]
      summary: Delete an owner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /monthly-plans:
    get:
      operationId: listMonthlyPlans
      tags: [monthly-plans]
      summary: List monthly plans
      parameters:
        - name: budgetLineId
          in: query
          required: false
          schema:
            type: integer
        - name: year
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of monthly plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyPlan"
    post:
      operationId: createMonthlyPlan
      tags: [monthly-plans]
      summary: Create a monthly plan entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMonthlyPlanBody"
      responses:
        "201":
          description: Created monthly plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyPlan"

  /monthly-plans/{id}:
    patch:
      operationId: updateMonthlyPlan
      tags: [monthly-plans]
      summary: Update a monthly plan entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMonthlyPlanBody"
      responses:
        "200":
          description: Updated monthly plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyPlan"
        "404":
          description: Not found

  /monthly-actuals:
    get:
      operationId: listMonthlyActuals
      tags: [monthly-actuals]
      summary: List monthly actuals
      parameters:
        - name: budgetLineId
          in: query
          required: false
          schema:
            type: integer
        - name: year
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of monthly actuals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyActual"
    post:
      operationId: createMonthlyActual
      tags: [monthly-actuals]
      summary: Create a monthly actual entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMonthlyActualBody"
      responses:
        "201":
          description: Created monthly actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyActual"

  /monthly-actuals/{id}:
    patch:
      operationId: updateMonthlyActual
      tags: [monthly-actuals]
      summary: Update a monthly actual entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMonthlyActualBody"
      responses:
        "200":
          description: Updated monthly actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyActual"
        "404":
          description: Not found

  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: List alerts
      parameters:
        - name: resolved
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /alerts/{id}/resolve:
    patch:
      operationId: resolveAlert
      tags: [alerts]
      summary: Resolve an alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resolved alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "404":
          description: Not found

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List marketing events
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketingEvent"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create a marketing event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventBody"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingEvent"

  /events/{id}:
    patch:
      operationId: updateEvent
      tags: [events]
      summary: Update a marketing event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventBody"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingEvent"
        "404":
          description: Not found
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete a marketing event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /dashboard/charts:
    get:
      operationId: getDashboardCharts
      tags: [dashboard]
      summary: Get chart data for dashboard visualisations
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: integer
            default: 2026
      responses:
        "200":
          description: Chart data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardCharts"

  /projections:
    get:
      operationId: getProjections
      tags: [dashboard]
      summary: Get forward projections for fixed cost lines
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: integer
            default: 2026
      responses:
        "200":
          description: Projection data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionData"

  /alerts/evaluate:
    post:
      operationId: evaluateAlerts
      tags: [alerts]
      summary: Evaluate alert rules against current data
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: integer
            default: 2026
      responses:
        "200":
          description: Evaluation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertEvaluationResult"

  /budget-lines/with-monthly:
    get:
      operationId: listBudgetLinesWithMonthly
      tags: [budget-lines]
      summary: List budget lines with their monthly plan and actual data
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: integer
            default: 2026
      responses:
        "200":
          description: Budget lines with monthly data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetLineWithMonthly"

  /imports:
    get:
      operationId: listImports
      tags: [imports]
      summary: List CSV imports
      responses:
        "200":
          description: List of imports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CsvImport"

  /imports/upload:
    post:
      operationId: uploadCsvImport
      tags: [imports]
      summary: Upload and parse a CSV file of monthly actuals
      responses:
        "201":
          description: Import created with matched/unmatched rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvImportWithRows"

  /imports/{id}:
    get:
      operationId: getImport
      tags: [imports]
      summary: Get an import with its rows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Import with rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvImportWithRows"
        "404":
          description: Not found
    delete:
      operationId: deleteImport
      tags: [imports]
      summary: Delete an import and roll back its actuals
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  id:
                    type: integer
                  previousStatus:
                    type: string
                required:
                  - success
                  - id
                  - previousStatus
        "404":
          description: Not found

  /imports/{id}/confirm:
    post:
      operationId: confirmImport
      tags: [imports]
      summary: Confirm import and create MonthlyActual records
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Confirmation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportConfirmResult"
        "404":
          description: Not found

  /imports/rows/{id}/assign:
    patch:
      operationId: assignImportRow
      tags: [imports]
      summary: Assign an unmatched import row to a budget line
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignImportRowBody"
      responses:
        "200":
          description: Updated row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvImportRow"
        "404":
          description: Not found

  /board/settings:
    get:
      operationId: listBoardSettings
      tags: [board]
      summary: List all board visibility settings
      responses:
        "200":
          description: Board settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BoardSetting"
    put:
      operationId: updateBoardSettings
      tags: [board]
      summary: Update board visibility settings (batch)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/UpdateBoardSettingBody"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BoardSetting"

  /board/tokens:
    get:
      operationId: listShareTokens
      tags: [board]
      summary: List share tokens
      responses:
        "200":
          description: Share tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShareToken"
    post:
      operationId: createShareToken
      tags: [board]
      summary: Create a new share token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareTokenBody"
      responses:
        "201":
          description: Created share token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareToken"

  /board/tokens/{id}/revoke:
    patch:
      operationId: revokeShareToken
      tags: [board]
      summary: Revoke a share token
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Revoked token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareToken"
        "404":
          description: Not found

  /board/view:
    get:
      operationId: getBoardView
      tags: [board]
      summary: Get the board view data (token-authenticated)
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Board view data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardViewData"
        "401":
          description: Invalid or expired token
        "403":
          description: Token revoked

  /board/preview:
    get:
      operationId: getBoardPreview
      tags: [board]
      summary: Get the board preview data (VP Marketing - no token needed)
      responses:
        "200":
          description: Board preview data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardViewData"

  /exports/pdf:
    get:
      operationId: exportPdf
      tags: [exports]
      summary: Export board view as PDF
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /exports/excel:
    get:
      operationId: exportExcel
      tags: [exports]
      summary: Export actuals and projections as Excel
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Excel file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /reforecast/versions:
    get:
      operationId: listForecastVersions
      tags: [reforecast]
      summary: List all forecast versions
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: integer
            default: 2026
      responses:
        "200":
          description: List of forecast versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ForecastVersion"
