  /excel/export:
    get:
      operationId: exportBudgetExcel
      tags: [excel]
      summary: Export budget as Excel
      description: Downloads the complete current budget as a formatted .xlsx file
      responses:
        "200":
          description: Excel file stream
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /excel/validate:
    post:
      operationId: validateBudgetExcel
      tags: [excel]
      summary: Validate an Excel file without importing
      description: >
        Validates the structure and data of an .xlsx file without writing to the
        database. If the workbook has multiple sheets and no `sheetName` is
        provided, returns `needsSheetSelection: true` with the available sheet
        names so the caller can prompt the user to pick one. Otherwise returns
        errors or a row count if valid.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                sheetName:
                  type: string
                  description: >
                    Name of the sheet to import data from. Required when the workbook has
                    multiple sheets — if omitted and the workbook has more than one sheet,
                    the endpoint returns needsSheetSelection instead of validating. For
                    single-sheet workbooks, omit this field and the sole sheet is used.
              required:
                - file
      responses:
        "200":
          description: Validation passed, or sheet selection is required
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ExcelValidateResult"
                  - $ref: "#/components/schemas/ExcelSheetSelectionRequired"
        "400":
          description: No file uploaded
        "422":
          description: Validation failed — structural or data errors found in the file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcelImportValidationError"

  /excel/import:
    post:
      operationId: importBudgetExcel
      tags: [excel]
      summary: Import budget from Excel
      description: Accepts an .xlsx file in the export format, validates it, then upserts the budget data
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                sheetName:
                  type: string
                  description: Name of the sheet to import. Defaults to "Budget Lines" when omitted.
              required:
                - file
      responses:
        "200":
          description: Import succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcelImportResult"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcelImportValidationError"

  /snapshots:
    post:
      operationId: createSnapshot
      tags: [snapshots]
      summary: Save a budget snapshot
      description: Captures current DB state to a JSON file in /snapshots, applies housekeeping, returns SnapshotMeta
      requestBody:
