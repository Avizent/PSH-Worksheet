          description: Snapshot not found
    delete:
      operationId: deleteSnapshot
      tags: [snapshots]
      summary: Delete a snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Snapshot not found

  /snapshots/compare:
    get:
      operationId: compareSnapshots
      tags: [snapshots]
      summary: Compare two snapshots
      description: Returns a line-by-line diff between two snapshots (added, removed, changed, unchanged lines)
      parameters:
        - name: a
          in: query
          required: true
          schema:
            type: string
          description: ID of the "before" snapshot
        - name: b
          in: query
          required: true
          schema:
            type: string
          description: ID of the "after" snapshot
      responses:
        "200":
          description: Snapshot diff result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotDiff"
        "400":
          description: Missing or invalid snapshot IDs
        "404":
          description: One or both snapshots not found

  /snapshots/{id}/pin:
    patch:
      operationId: pinSnapshot
      tags: [snapshots]
      summary: Pin or unpin a snapshot
      description: Sets the pinned flag on a snapshot. Pinned snapshots are never removed during housekeeping.
      parameters:
        - name: id
          in: path
          required: true
          schema:
