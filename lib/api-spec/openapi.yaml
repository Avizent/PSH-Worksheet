openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard summary
  - name: budget-lines
    description: Budget line items
  - name: monthly-plans
    description: Monthly plan amounts
  - name: monthly-actuals
    description: Monthly actual amounts
  - name: alerts
    description: Budget alerts
  - name: events
    description: Marketing events
  - name: board
    description: Board view settings, tokens, and data
  - name: exports
    description: PDF and Excel exports
  - name: seed
    description: Data seeding
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard KPI summary
      description: Returns aggregated KPI data for the budget dashboard
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: integer
            default: 2026
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /budget-lines:
    get:
      operationId: listBudgetLines
      tags: [budget-lines]
      summary: List all budget lines
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: costStatus
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of budget lines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetLine"
    post:
      operationId: createBudgetLine
      tags: [budget-lines]
      summary: Create a budget line
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBudgetLineBody"
      responses:
        "201":
          description: Created budget line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetLine"

  /budget-lines/{id}:
    get:
      operationId: getBudgetLine
      tags: [budget-lines]
      summary: Get a budget line
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Budget line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetLine"
        "404":
          description: Not found
    patch:
      operationId: updateBudgetLine
      tags: [budget-lines]
      summary: Update a budget line
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBudgetLineBody"
      responses:
        "200":
          description: Updated budget line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetLine"
        "404":
          description: Not found
    delete:
      operationId: deleteBudgetLine
      tags: [budget-lines]
      summary: Delete a budget line
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /monthly-plans:
    get:
      operationId: listMonthlyPlans
      tags: [monthly-plans]
      summary: List monthly plans
      parameters:
        - name: budgetLineId
          in: query
          required: false
          schema:
            type: integer
        - name: year
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of monthly plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyPlan"
    post:
      operationId: createMonthlyPlan
      tags: [monthly-plans]
      summary: Create a monthly plan entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMonthlyPlanBody"
      responses:
        "201":
          description: Created monthly plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyPlan"

  /monthly-plans/{id}:
    patch:
      operationId: updateMonthlyPlan
      tags: [monthly-plans]
      summary: Update a monthly plan entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMonthlyPlanBody"
      responses:
        "200":
          description: Updated monthly plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyPlan"
        "404":
          description: Not found

  /monthly-actuals:
    get:
      operationId: listMonthlyActuals
      tags: [monthly-actuals]
      summary: List monthly actuals
      parameters:
        - name: budgetLineId
          in: query
          required: false
          schema:
            type: integer
        - name: year
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of monthly actuals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyActual"
    post:
      operationId: createMonthlyActual
      tags: [monthly-actuals]
      summary: Create a monthly actual entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMonthlyActualBody"
      responses:
        "201":
          description: Created monthly actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyActual"

  /monthly-actuals/{id}:
    patch:
      operationId: updateMonthlyActual
      tags: [monthly-actuals]
      summary: Update a monthly actual entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMonthlyActualBody"
      responses:
        "200":
          description: Updated monthly actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyActual"
        "404":
          description: Not found

  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: List alerts
      parameters:
        - name: resolved
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /alerts/{id}/resolve:
    patch:
      operationId: resolveAlert
      tags: [alerts]
      summary: Resolve an alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resolved alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "404":
          description: Not found

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List marketing events
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketingEvent"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create a marketing event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventBody"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingEvent"

  /events/{id}:
    patch:
      operationId: updateEvent
      tags: [events]
      summary: Update a marketing event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventBody"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingEvent"
        "404":
          description: Not found
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete a marketing event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /dashboard/charts:
    get:
      operationId: getDashboardCharts
      tags: [dashboard]
      summary: Get chart data for dashboard visualisations
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: integer
            default: 2026
      responses:
        "200":
          description: Chart data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardCharts"

  /projections:
    get:
      operationId: getProjections
      tags: [dashboard]
      summary: Get forward projections for fixed cost lines
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: integer
            default: 2026
      responses:
        "200":
          description: Projection data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionData"

  /alerts/evaluate:
    post:
      operationId: evaluateAlerts
      tags: [alerts]
      summary: Evaluate alert rules against current data
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: integer
            default: 2026
      responses:
        "200":
          description: Evaluation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertEvaluationResult"

  /budget-lines/with-monthly:
    get:
      operationId: listBudgetLinesWithMonthly
      tags: [budget-lines]
      summary: List budget lines with their monthly plan and actual data
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: integer
            default: 2026
      responses:
        "200":
          description: Budget lines with monthly data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetLineWithMonthly"

  /imports:
    get:
      operationId: listImports
      tags: [imports]
      summary: List CSV imports
      responses:
        "200":
          description: List of imports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CsvImport"

  /imports/upload:
    post:
      operationId: uploadCsvImport
      tags: [imports]
      summary: Upload and parse a CSV file of monthly actuals
      responses:
        "201":
          description: Import created with matched/unmatched rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvImportWithRows"

  /imports/{id}:
    get:
      operationId: getImport
      tags: [imports]
      summary: Get an import with its rows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Import with rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvImportWithRows"
        "404":
          description: Not found

  /imports/{id}/confirm:
    post:
      operationId: confirmImport
      tags: [imports]
      summary: Confirm import and create MonthlyActual records
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Confirmation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportConfirmResult"
        "404":
          description: Not found

  /imports/rows/{id}/assign:
    patch:
      operationId: assignImportRow
      tags: [imports]
      summary: Assign an unmatched import row to a budget line
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignImportRowBody"
      responses:
        "200":
          description: Updated row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvImportRow"
        "404":
          description: Not found

  /board/settings:
    get:
      operationId: listBoardSettings
      tags: [board]
      summary: List all board visibility settings
      responses:
        "200":
          description: Board settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BoardSetting"
    put:
      operationId: updateBoardSettings
      tags: [board]
      summary: Update board visibility settings (batch)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/UpdateBoardSettingBody"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BoardSetting"

  /board/tokens:
    get:
      operationId: listShareTokens
      tags: [board]
      summary: List share tokens
      responses:
        "200":
          description: Share tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShareToken"
    post:
      operationId: createShareToken
      tags: [board]
      summary: Create a new share token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareTokenBody"
      responses:
        "201":
          description: Created share token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareToken"

  /board/tokens/{id}/revoke:
    patch:
      operationId: revokeShareToken
      tags: [board]
      summary: Revoke a share token
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Revoked token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareToken"
        "404":
          description: Not found

  /board/view:
    get:
      operationId: getBoardView
      tags: [board]
      summary: Get the board view data (token-authenticated)
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Board view data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardViewData"
        "401":
          description: Invalid or expired token
        "403":
          description: Token revoked

  /board/preview:
    get:
      operationId: getBoardPreview
      tags: [board]
      summary: Get the board preview data (VP Marketing - no token needed)
      responses:
        "200":
          description: Board preview data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardViewData"

  /exports/pdf:
    get:
      operationId: exportPdf
      tags: [exports]
      summary: Export board view as PDF
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /exports/excel:
    get:
      operationId: exportExcel
      tags: [exports]
      summary: Export actuals and projections as Excel
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Excel file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /seed:
    post:
      operationId: seedData
      tags: [seed]
      summary: Seed budget data from sample data
      description: Populates the database with sample marketing budget data for FY26
      responses:
        "200":
          description: Seed completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeedResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DashboardSummary:
      type: object
      properties:
        totalBudget:
          type: number
        spentYtd:
          type: number
        remaining:
          type: number
        fixedRunRate:
          type: number
        activeAlerts:
          type: integer
        budgetUtilisation:
          type: number
        monthsElapsed:
          type: integer
        totalMonths:
          type: integer
      required:
        - totalBudget
        - spentYtd
        - remaining
        - fixedRunRate
        - activeAlerts
        - budgetUtilisation
        - monthsElapsed
        - totalMonths

    BudgetLine:
      type: object
      properties:
        id:
          type: integer
        category:
          type: string
        subcategory:
          type: ["string", "null"]
        lineItem:
          type: string
        owner:
          type: ["string", "null"]
        region:
          type: ["string", "null"]
        costStatus:
          type: string
        projectionPct:
          type: number
          default: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - category
        - lineItem
        - costStatus
        - projectionPct
        - createdAt
        - updatedAt

    CreateBudgetLineBody:
      type: object
      properties:
        category:
          type: string
        subcategory:
          type: string
        lineItem:
          type: string
        owner:
          type: string
        region:
          type: string
        costStatus:
          type: string
        projectionPct:
          type: number
      required:
        - category
        - lineItem
        - costStatus

    UpdateBudgetLineBody:
      type: object
      properties:
        category:
          type: string
        subcategory:
          type: string
        lineItem:
          type: string
        owner:
          type: string
        region:
          type: string
        costStatus:
          type: string
        projectionPct:
          type: number

    MonthlyPlan:
      type: object
      properties:
        id:
          type: integer
        budgetLineId:
          type: integer
        month:
          type: integer
        year:
          type: integer
        plannedAmount:
          type: number
        boardAmount:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - budgetLineId
        - month
        - year
        - plannedAmount
        - createdAt
        - updatedAt

    CreateMonthlyPlanBody:
      type: object
      properties:
        budgetLineId:
          type: integer
        month:
          type: integer
        year:
          type: integer
        plannedAmount:
          type: number
        boardAmount:
          type: number
      required:
        - budgetLineId
        - month
        - year
        - plannedAmount

    UpdateMonthlyPlanBody:
      type: object
      properties:
        plannedAmount:
          type: number
        boardAmount:
          type: number

    MonthlyActual:
      type: object
      properties:
        id:
          type: integer
        budgetLineId:
          type: integer
        month:
          type: integer
        year:
          type: integer
        actualAmount:
          type: number
        invoiceRef:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - budgetLineId
        - month
        - year
        - actualAmount
        - createdAt
        - updatedAt

    CreateMonthlyActualBody:
      type: object
      properties:
        budgetLineId:
          type: integer
        month:
          type: integer
        year:
          type: integer
        actualAmount:
          type: number
        invoiceRef:
          type: string
      required:
        - budgetLineId
        - month
        - year
        - actualAmount

    UpdateMonthlyActualBody:
      type: object
      properties:
        actualAmount:
          type: number
        invoiceRef:
          type: string

    Alert:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        severity:
          type: string
        message:
          type: string
        month:
          type: ["integer", "null"]
        year:
          type: ["integer", "null"]
        budgetLineId:
          type: ["integer", "null"]
        resolvedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - severity
        - message
        - createdAt

    MarketingEvent:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        eventDate:
          type: ["string", "null"]
          format: date-time
        status:
          type: string
        estimatedCost:
          type: ["number", "null"]
        budgetLineId:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - status
        - createdAt
        - updatedAt

    CreateEventBody:
      type: object
      properties:
        name:
          type: string
        eventDate:
          type: string
          format: date-time
        status:
          type: string
        estimatedCost:
          type: number
        budgetLineId:
          type: integer
      required:
        - name
        - status

    UpdateEventBody:
      type: object
      properties:
        name:
          type: string
        eventDate:
          type: string
          format: date-time
        status:
          type: string
        estimatedCost:
          type: number
        budgetLineId:
          type: integer

    BudgetLineWithMonthly:
      type: object
      properties:
        id:
          type: integer
        category:
          type: string
        subcategory:
          type: ["string", "null"]
        lineItem:
          type: string
        owner:
          type: ["string", "null"]
        region:
          type: ["string", "null"]
        costStatus:
          type: string
        projectionPct:
          type: number
          default: 0
        plans:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyPlan"
        actuals:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyActual"
        projections:
          type: array
          items:
            type: object
            properties:
              month:
                type: integer
              projected:
                type: ["number", "null"]
            required:
              - month
      required:
        - id
        - category
        - lineItem
        - costStatus
        - plans
        - actuals

    MonthlyChartPoint:
      type: object
      properties:
        month:
          type: integer
        monthLabel:
          type: string
        planned:
          type: number
        actual:
          type: number
        cumPlanned:
          type: number
        cumActual:
          type: number
      required:
        - month
        - monthLabel
        - planned
        - actual
        - cumPlanned
        - cumActual

    CategoryBreakdown:
      type: object
      properties:
        category:
          type: string
        planned:
          type: number
        actual:
          type: number
      required:
        - category
        - planned
        - actual

    DashboardCharts:
      type: object
      properties:
        monthly:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyChartPoint"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryBreakdown"
      required:
        - monthly
        - categories

    ProjectionLineItem:
      type: object
      properties:
        budgetLineId:
          type: integer
        lineItem:
          type: string
        category:
          type: string
        costStatus:
          type: string
        projectionPct:
          type: number
        months:
