kind = "mobile"
previewPath = "/budget-tracker/"
title = "Hubert Budget Tracker"
version = "1.0.0"
id = "artifacts/budget-tracker"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/budget-tracker/" ]
localPort = 25099

[services.development]
run = "pnpm --filter @workspace/budget-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/budget-tracker", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/budget-tracker", "run", "serve" ]

[services.env]
PORT = "25099"
BASE_PATH = "/budget-tracker/"
