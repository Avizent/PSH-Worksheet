<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Connect your database</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    margin: 0;
    padding: 24px;
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 6px; }
  p { font-size: 12px; color: #6e6e73; margin: 0 0 16px; line-height: 1.4; }
  textarea {
    width: 100%;
    box-sizing: border-box;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid #d2d2d7;
    resize: vertical;
    min-height: 64px;
  }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  button {
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
  }
  .primary { background: #0071e3; color: white; }
  .primary:disabled { background: #99c9f2; cursor: default; }
  .secondary { background: #e8e8ed; color: #1d1d1f; }
  #status { margin-top: 12px; font-size: 12px; min-height: 16px; }
  #status.error { color: #d70015; }
  #status.ok { color: #1e8e3e; }
</style>
</head>
<body>
  <h1>Connect your database</h1>
  <p>
    Paste your Supabase project's Postgres connection string
    (Project Settings &rarr; Database &rarr; Connection string &rarr; URI).
    This is stored encrypted on this Mac only and is never sent anywhere else.
  </p>
  <textarea id="connectionString" placeholder="postgresql://postgres.xxxx:PASSWORD@aws-0-region.pooler.supabase.com:5432/postgres"></textarea>
  <div class="row">
    <button id="testBtn" class="secondary">Test Connection</button>
    <button id="saveBtn" class="primary" disabled>Save &amp; Continue</button>
  </div>
  <div id="status"></div>

  <script>
    const textarea = document.getElementById("connectionString");
    const testBtn = document.getElementById("testBtn");
    const saveBtn = document.getElementById("saveBtn");
    const status = document.getElementById("status");

    function setStatus(text, kind) {
      status.textContent = text;
      status.className = kind || "";
    }

    testBtn.addEventListener("click", async () => {
      const value = textarea.value.trim();
      if (!value) {
        setStatus("Enter a connection string first.", "error");
        return;
      }
      testBtn.disabled = true;
      saveBtn.disabled = true;
      setStatus("Testing connection...");
      try {
        const result = await window.dbSetup.test(value);
        if (result.ok) {
          setStatus("Connection succeeded.", "ok");
          saveBtn.disabled = false;
        } else {
          setStatus("Connection failed: " + result.error, "error");
        }
      } catch (e) {
        setStatus("Unexpected error: " + (e && e.message ? e.message : e), "error");
      } finally {
        testBtn.disabled = false;
      }
    });

    saveBtn.addEventListener("click", async () => {
      const value = textarea.value.trim();
      saveBtn.disabled = true;
      testBtn.disabled = true;
      setStatus("Setting up database...");
      try {
        const result = await window.dbSetup.save(value);
        if (!result.ok) {
          setStatus("Failed to start: " + result.error, "error");
          testBtn.disabled = false;
          saveBtn.disabled = false;
        }
        // On success, the main process closes this window and opens the app.
      } catch (e) {
        setStatus("Unexpected error: " + (e && e.message ? e.message : e), "error");
        testBtn.disabled = false;
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
