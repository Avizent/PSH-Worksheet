packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

autoInstallPeers: false

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.1
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.0
  zod: 3.25.76

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@replit/*'
  - stripe-replit-sync

onlyBuiltDependencies:
  - '@swc/core'
  - electron
  - esbuild
  - msw
  - unrs-resolver

overrides:
  '@esbuild-kit/esm-loader': npm:tsx@^4.21.0
  '@tailwindcss/vite>vite': 7.3.6
  # Keep a single copy of the React types. Two copies make structurally
  # identical types (Ref, VoidOrUndefinedOnly) compare as unrelated. Pinned to
  # the version Expo SDK 54 expects, which budget-tracker already requires.
  '@types/react': 19.1.17
  # vitest 4 pulls in vite 8, which the vite plugins were resolving their peer
  # against - while the apps use vite 7. Pin the plugins' peer to the app's
  # version so Plugin types line up in vite.config.ts.
  '@vitejs/plugin-react>vite': 7.3.6
  esbuild: 0.27.3
